[alembic]
# Both paths are relative to this file's directory (the repo root), which is
# also where main.py and .env live - so `alembic upgrade head` and
# `uvicorn main:app` are run from the same working directory.
script_location = src/migrations
prepend_sys_path = src
version_path_separator = os

# sqlalchemy.url is intentionally omitted here - migrations/env.py sets it
# at runtime from Settings.DATABASE_URL (same .env-backed config the app uses)
# so there's a single source of truth for the connection string.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
