<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/wedy-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bidsense — Offer Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the stored theme before first paint so a dark-mode user
      // never sees a white flash. Kept in sync with src/lib/theme.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem("bidsense-theme")
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
